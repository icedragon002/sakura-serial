name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & Package
        run: npm run package:ci

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display structure
        run: ls -R artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "🌸 Sakura Serial ${{ github.ref_name }}"
          body: |
            ## ✨ Changes

            - See [commits](${{ github.server_url }}/${{ github.repository }}/compare/${{ github.event.before }}...${{ github.sha }})

            ## 📦 Downloads

            | Platform | File |
            |----------|------|
            | 🪟 Windows | `sakura-serial-*-setup.exe` |
            | 🍎 macOS | `sakura-serial-*.dmg` |
            | 🐧 Linux | `sakura-serial-*.AppImage` / `.deb` |

            > Run the installer to upgrade. Previous settings are preserved.
          files: artifacts/*
          draft: false
          prerelease: false
